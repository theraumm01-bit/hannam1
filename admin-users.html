      .board-item .b-date { margin-top: 10px; }
    }
  </style>
</head>

<body>

        <span class="util-sep">|</span>
        <a href="auth.html">로그인</a>
        <span class="util-sep">|</span>
        <a href="auth.html?tab=signup">회원가입</a>
      </div>
    </div>
  </div>


  <header>
    <div class="nav">
      <a href="index.html" class="brand"><span class="mark">南</span>한남1구역 재개발 추진준비위원회</a>
      <nav class="navlinks">
        <a href="index.html#story">왜 지금인가</a>
        <a href="index.html#why">신속통합기획</a>

  </header>


  <section class="page-hero">
    <div class="wrap">
      <div class="eyebrow">관리자 전용</div>
      <h2>회원 관리(가입 승인)</h2>
      <p class="lede">가입을 요청한 회원 목록을 확인하고 승인 또는 거절 처리하실 수 있습니다.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div id="listView">
        <div class="board-toolbar">
          <div class="board-count" id="userCount">불러오는 중...</div>
        </div>
        <div class="board-list" id="userList"></div>
      </div>
    </div>
  </section>


  <footer>
    <div class="wrap">
      <div class="foot-top">
        <div class="foot-brand">한남1구역 재개발 추진준비위원회</div>
        <div class="foot-links">
          <a href="index.html">홈</a>
          <a href="index.html#why">신속통합기획</a>
          <a href="notice-board.html">공지사항</a>
          <a href="inquiry-board.html">문의하기</a>
          <a href="auth.html">로그인/회원가입</a>
        </div>
      </div>
    </div>
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 관리자 권한 체크
      const userStr = localStorage.getItem('user');
      let isAdmin = false;
      if (userStr) {
        try { isAdmin = JSON.parse(userStr).role === 'admin'; } catch (e) { }
      }

      if (!isAdmin) {
        window.showCustomAlert('관리자 전용 페이지입니다.');
        setTimeout(() => { location.href = 'index.html'; }, 1500);
        return;
      }

      loadUsers();
    });

    async function loadUsers() {
      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        const filteredUsers = (data || []).filter(u => u.role !== 'admin');
        renderUsers(filteredUsers);
      } catch (e) {
        console.error(e);
        document.getElementById('userList').innerHTML = '<div class="board-empty">회원 목록을 불러오지 못했습니다.</div>';
      }
    }

    function renderUsers(users) {
      const box = document.getElementById('userList');
      const countEl = document.getElementById('userCount');

      countEl.textContent = '전체 가입자 ' + users.length + '명';

      if (!users.length) {
        box.innerHTML = '<div class="board-empty">가입한 회원이 없습니다.</div>';
        return;
      }

      box.innerHTML = users.map((u, i) => {
        let statusBadge = '';
        let actionBtns = '';

        if (u.status === 'pending') {
          statusBadge = `<span class="badge badge-wait">대기중</span>`;
          actionBtns = `
                <button class="btn btn-primary btn-sm" onclick="updateStatus('${u.id}', 'approved')">승인</button>
                <button class="btn btn-ghost btn-sm" onclick="updateStatus('${u.id}', 'rejected')">거절</button>
              `;
        } else if (u.status === 'approved') {
          statusBadge = `<span class="badge badge-pin">승인됨</span>`;
          actionBtns = `
                <button class="btn btn-ghost btn-sm" onclick="updateStatus('${u.id}', 'rejected')">거절로 변경</button>
              `;
        } else if (u.status === 'rejected') {
          statusBadge = `<span class="badge" style="background:rgba(244,67,54,0.15);color:#F44336;">거절됨</span>`;
          actionBtns = `
                <button class="btn btn-primary btn-sm" onclick="updateStatus('${u.id}', 'approved')">승인으로 변경</button>
              `;
        } else if (u.status === 'withdrawn') {
          statusBadge = `<span class="badge" style="background:#555;color:#fff;">탈퇴됨</span>`;
          actionBtns = ``;
        } else {
          statusBadge = `<span class="badge badge-pin">승인됨(구회원)</span>`;
          actionBtns = `
                <button class="btn btn-ghost btn-sm" onclick="updateStatus('${u.id}', 'rejected')">거절로 변경</button>
              `;
        }

        if (u.status !== 'withdrawn') {
          actionBtns += `
                <button class="btn btn-ghost btn-sm" style="color:#F44336; border-color:#F44336;" onclick="withdrawUser('${u.id}', '${u.userid}')">탈퇴</button>
          `;
        }

        return `
            <div class="board-item" style="cursor:default;">
              <div class="b-no">${users.length - i}</div>
              <div class="b-title" style="flex-direction:column; align-items:flex-start; gap:4px; margin-right:16px;">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="tt">${u.name} (${u.userid})</span> 
                  ${statusBadge}
                </div>
                <div style="font-size:13.5px; color:var(--mist-dim); font-weight:normal;">연락처: ${u.phone} | 주소: ${u.address || '없음'} | 지번: ${u.land || '없음'}</div>
              </div>
              <div class="b-date" style="display:flex; gap:8px;">
                ${actionBtns}
              </div>
            </div>
          `;
      }).join('');
    }

    window.updateStatus = async function (id, newStatus) {
      window.showCustomConfirm(
        newStatus === 'approved' ? '해당 회원을 승인하시겠습니까?' : '해당 회원의 가입을 거절하시겠습니까?',
        async () => {
          try {
            const { error } = await supabaseClient.from('users').update({ status: newStatus }).eq('id', id);
            if (error) throw error;

            window.showCustomAlert('처리가 완료되었습니다.');
            loadUsers();
          } catch (e) {
            console.error(e);
            window.showCustomAlert('상태 업데이트 중 오류가 발생했습니다.');
          }
        }
      );
    };

    window.withdrawUser = async function (id, userid) {
      window.showCustomConfirm(
        `정말 <b>${userid}</b> 회원을 탈퇴 처리하시겠습니까?<br><span style="font-size:13px; color:#F44336;">해당 아이디는 즉시 재가입이 가능하도록 변경됩니다.</span>`,
        async () => {
          try {
            const newUserId = userid + '_del_' + Date.now();
            const { error } = await supabaseClient.from('users').update({ 
              status: 'withdrawn', 
              userid: newUserId 
            }).eq('id', id);
            
            if (error) throw error;

            window.showCustomAlert('회원 탈퇴 처리가 완료되었습니다.');
            loadUsers();
          } catch (e) {
            console.error(e);
            window.showCustomAlert('처리 중 오류가 발생했습니다.');
          }
        }
      );
    };
  </script>
</body>
