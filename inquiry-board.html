  <section class="section">
    <div class="wrap">
      <div class="write-toggle">
        <button class="btn btn-primary btn-sm" id="btnToggleWrite">+ 문의 작성하기</button>
      </div>

      <div class="panel" id="writePanel">
        <div class="form-grid">
          <div class="form-row">
            <label>성함 <span class="req">*</span></label>
            <input type="text" id="qName" placeholder="이름을 입력하세요">
          </div>
          <div class="form-row">
            <label>연락처</label>
            <input type="tel" id="qPhone" placeholder="010-0000-0000">
          </div>
          <div class="form-row full">
            <label>비밀번호 <span class="req">*</span></label>
            <input type="password" id="qPassword" placeholder="비밀번호를 입력하세요">
          </div>
          <div class="form-row full">
            <label>제목 <span class="req">*</span></label>
            <input type="text" id="qTitle" placeholder="문의 제목을 입력하세요">
          </div>
          <div class="form-row full">
            <label>내용 <span class="req">*</span></label>
            <textarea id="qBody" placeholder="문의 내용을 입력하세요"></textarea>
          </div>
          <div class="form-row full">
            <div class="checkbox-row">
              <input type="checkbox" id="qAgreePrivacy">
              <label for="qAgreePrivacy">문의 처리를 위한 개인정보(성함·연락처·문의내용) 수집·이용에 동의합니다. <span class="req">*</span></label>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="btnSaveInquiry">등록하기</button>
          <button class="btn btn-ghost" id="btnCancelWrite">취소</button>
        </div>
        <div class="form-msg" id="inquiryMsg"></div>
      </div>

      <div id="listView">
        <div class="board-toolbar">
          <div class="board-count" id="inquiryCount">불러오는 중...</div>
        </div>
        <div class="board-list" id="inquiryList"></div>
      </div>

      <div id="detailView" style="display:none;">
        <a class="back-link" id="backToList" href="#">← 목록으로</a>
        <div class="detail-head">
          <div class="detail-title" id="dTitle"></div>
          <div class="detail-meta">
            <span id="dName"></span><span id="dDate"></span>
            <span class="badge badge-wait" id="dStatus"></span>
          </div>
        </div>
        <div class="detail-body" id="dBody"></div>
        <div class="detail-answer" id="dAnswerBox" style="display:none;">
          <div class="aa-tag">추진위원회 답변</div>
          <div id="dAnswer" style="display:none;"></div>
          <button id="btnUnlockAnswer" class="btn btn-ghost btn-sm" style="margin-top:10px; display:none;">답변 확인하기 (비밀번호
            필요)</button>
        </div>

        <div class="panel" style="margin-top:30px;">
          <div class="form-row full">
            <label>답변 작성</label>
            <textarea id="answerBody" placeholder="답변 내용을 입력하세요"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost btn-sm" id="btnSaveAnswer">답변 등록</button>
          </div>
        </div>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function fmtDate(ts) { const d = new Date(ts); return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); }

    let currentInquiries = [];

    async function loadInquiries() {
      try {
        let query = supabaseClient.from('inquiries').select('*').order('created_at', { ascending: false });

        const { data, error } = await query;
        if (error) throw error;
        return data || [];
      } catch (e) {
        console.error(e);
        return [];
      }
    }

    async function saveInquiry(q) {
      try {
        if (q.id && q.id.includes('-')) {
          // uuid update (answer)
          const { error } = await supabaseClient.from('inquiries').update({ answer: q.answer }).eq('id', q.id);
          if (error) throw error;
        } else {
          // insert
          const { error } = await supabaseClient.from('inquiries').insert([{
            name: q.name, phone: q.phone, title: q.title, body: q.body, pw: q.password
          }]);
          if (error) throw error;
        }
        return { success: true };
      } catch (e) {
        console.error(e);
        return undefined;
      }
    }

    function renderList() {
      const box = document.getElementById('inquiryList');
      const countEl = document.getElementById('inquiryCount');
      countEl.textContent = '전체 ' + currentInquiries.length + '건';
      if (!currentInquiries.length) {
        box.innerHTML = '<div class="board-empty">등록된 문의가 없습니다. 첫 문의를 남겨주세요.</div>';
        return;
      }
      box.innerHTML = currentInquiries.map((q, i) => `
    <div class="board-item" data-id="${q.id}">
      <div class="b-no">${currentInquiries.length - i}</div>
      <div class="b-title"><span class="tt">${escapeHtml(q.title)}</span></div>
      <div class="b-date">${fmtDate(q.created_at)}</div>
      <div><span class="badge ${q.answer ? 'badge-done' : 'badge-wait'}">${q.answer ? '답변완료' : '답변대기'}</span></div>
    </div>
  `).join('');
      box.querySelectorAll('.board-item').forEach(el => {
        el.addEventListener('click', () => tryOpen(el.getAttribute('data-id')));
      });
    }

    function tryOpen(id) {
      const q = currentInquiries.find(x => x.id === id);
      if (!q) return;
      openDetail(id);
    }

    function openDetail(id) {
      const q = currentInquiries.find(x => x.id === id);
      if (!q) return;
      document.getElementById('listView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
      document.getElementById('dTitle').textContent = q.title;
      document.getElementById('dName').textContent = (q.name || '익명') + (q.name ? ' 님' : '');
      document.getElementById('dDate').textContent = fmtDate(q.created_at);
      document.getElementById('dStatus').textContent = q.answer ? '답변완료' : '답변대기';
      document.getElementById('dStatus').className = 'badge ' + (q.answer ? 'badge-done' : 'badge-wait');
      document.getElementById('dBody').textContent = q.body;
      // admin check
      const userStr = localStorage.getItem('user');
      let isAdmin = false;
      if (userStr) {
        try { isAdmin = JSON.parse(userStr).role === 'admin'; } catch (e) { }
      }

      if (q.answer) {
        document.getElementById('dAnswerBox').style.display = 'block';
        document.getElementById('dAnswer').textContent = q.answer;

        const ansEl = document.getElementById('dAnswer');
        const btnUnlock = document.getElementById('btnUnlockAnswer');

        if (isAdmin || !q.pw) {
          ansEl.style.display = 'block';
          btnUnlock.style.display = 'none';
        } else {
          ansEl.style.display = 'none';
          btnUnlock.style.display = 'inline-block';
          btnUnlock.onclick = () => {
            window.showCustomPrompt('게시글 비밀번호를 입력하세요.', (inputPw) => {
              if (inputPw === q.pw) {
                ansEl.style.display = 'block';
                btnUnlock.style.display = 'none';
              } else {
                window.showCustomAlert('비밀번호가 일치하지 않습니다.');
              }
            }, { isPassword: true });
          };
        }
      } else {
        document.getElementById('dAnswerBox').style.display = 'none';
      }

      const answerInputPanel = document.getElementById('answerBody').parentElement.parentElement;
      if (isAdmin) {
        answerInputPanel.style.display = 'block';
        document.getElementById('answerBody').value = q.answer || '';
        document.getElementById('btnSaveAnswer').onclick = async () => {
          q.answer = document.getElementById('answerBody').value.trim();
          await saveInquiry(q);
          await refresh();
          openDetail(id);
        };
      } else {
        answerInputPanel.style.display = 'none';
      }
    }
    document.getElementById('backToList').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
    });

    document.getElementById('btnToggleWrite').addEventListener('click', () => {
      const userStr = localStorage.getItem('user');
      if (!userStr) {
        window.showCustomConfirm('로그인이 필요한 서비스입니다.<br>로그인 화면으로 이동하시겠습니까?', () => {
          window.location.href = 'auth.html';
        });
        return;
      }

      try {
        const user = JSON.parse(userStr);
        if (user.name) document.getElementById('qName').value = user.name;
        if (user.phone) document.getElementById('qPhone').value = user.phone;
      } catch (e) { }

      document.getElementById('writePanel').classList.toggle('show');
    });
    document.getElementById('btnCancelWrite').addEventListener('click', () => {
      document.getElementById('writePanel').classList.remove('show');
    });

    document.getElementById('btnSaveInquiry').addEventListener('click', async () => {
      const name = document.getElementById('qName').value.trim();
      const phone = document.getElementById('qPhone').value.trim();
      const password = document.getElementById('qPassword').value.trim();
      const title = document.getElementById('qTitle').value.trim();
      const body = document.getElementById('qBody').value.trim();
      const agree = document.getElementById('qAgreePrivacy').checked;
      const msg = document.getElementById('inquiryMsg');

      if (!name || !password || !title || !body) { msg.textContent = '성함·비밀번호·제목·내용을 모두 입력해주세요.'; msg.className = 'form-msg show err'; return; }
      if (!agree) { msg.textContent = '개인정보 수집·이용 동의가 필요합니다.'; msg.className = 'form-msg show err'; return; }

      const q = { name, phone, password, title, body };
      const saved = await saveInquiry(q);
      if (!saved) {
        msg.textContent = '통신 오류가 발생했습니다.';
        msg.className = 'form-msg show err';
        return;
      }
      window.showCustomAlert('문의가 등록되었습니다.<br>순차적으로 답변드리겠습니다.');
      msg.className = 'form-msg';
      ['qTitle', 'qBody', 'qPassword'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('qAgreePrivacy').checked = false;
      document.getElementById('writePanel').classList.remove('show');
      await refresh();
    });

    async function refresh() {
      currentInquiries = await loadInquiries();
      renderList();
    }
    refresh();
  </script>
