  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function fmtDate(ts) { const d = new Date(ts); return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); }

    let currentNotices = [];

    async function loadNotices() {
      try {
        const { data, error } = await supabaseClient
          .from('notices')
          .select('*')
          .order('pinned', { ascending: false })
          .order('created_at', { ascending: false });
        if (error) throw error;
        return data || [];
      } catch (e) {
        console.error(e);
        return [];
      }
    }

    async function saveNotice(title, content, pinned) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const user = session ? session.user : null;
      const author_id = user ? user.id : null;

      const userStr = localStorage.getItem('user');
      let author_name = '관리자';
      if (userStr) {
        try { author_name = JSON.parse(userStr).name; } catch (e) { }
      }

      try {
        const { error } = await supabaseClient.from('notices').insert([{
          title, content, pinned, author_id, author_name
        }]);
        if (error) {
          return { error: error.message };
        }
        return { success: true };
      } catch (e) {
        return { error: '통신 오류' };
      }
    }

    function renderList() {
      const box = document.getElementById('noticeList');
      const countEl = document.getElementById('noticeCount');
      countEl.textContent = '전체 ' + currentNotices.length + '건';
      if (!currentNotices.length) {
        box.innerHTML = '<div class="board-empty">등록된 공지사항이 없습니다.</div>';
        return;
      }
      box.innerHTML = currentNotices.map((n, i) => `
    <div class="board-item" data-id="${n.id}">
      <div class="b-no">${(currentNotices.length - i)}</div>
      <div class="b-title">${n.pinned ? '<span class="badge badge-pin" style="margin-right:6px;">공지</span>' : ''}<span class="tt">${escapeHtml(n.title)}</span></div>
      <div class="b-date">${fmtDate(n.created_at)}</div>
      <div></div>
    </div>
  `).join('');
      box.querySelectorAll('.board-item').forEach(el => {
        el.addEventListener('click', () => openDetail(parseInt(el.getAttribute('data-id'))));
      });
    }

    function openDetail(id) {
      const n = currentNotices.find(x => x.id === id);
      if (!n) return;
      document.getElementById('listView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
      document.getElementById('dTitle').textContent = n.title;
      document.getElementById('dDate').textContent = fmtDate(n.created_at) + (n.author_name ? ' | ' + n.author_name : '');
      document.getElementById('dBody').textContent = n.content;
      document.getElementById('btnDeleteNotice').onclick = async () => {
        if (!confirm('이 공지를 삭제할까요?')) return;
        const { error } = await supabaseClient.from('notices').delete().eq('id', n.id);
        if (error) { alert('삭제 실패: ' + error.message); }
        closeDetail();
        await refresh();
      };
    }

    function closeDetail() {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
    }
    document.getElementById('backToList').addEventListener('click', (e) => { e.preventDefault(); closeDetail(); });

    async function refresh() {
      currentNotices = await loadNotices();
      renderList();
    }

    document.getElementById('btnToggleWrite').addEventListener('click', () => {
      document.getElementById('writePanel').classList.toggle('show');
    });
    document.getElementById('btnCancelWrite').addEventListener('click', () => {
      document.getElementById('writePanel').classList.remove('show');
    });
    document.getElementById('btnSaveNotice').addEventListener('click', async () => {
      const title = document.getElementById('nTitle').value.trim();
      const content = document.getElementById('nBody').value.trim();
      const msg = document.getElementById('noticeMsg');

      if (!title || !content) {
        msg.textContent = '제목과 내용을 모두 입력해주세요.';
        msg.className = 'form-msg show err';
        return;
      }

      const pinned = document.getElementById('nPinned').checked;
      const result = await saveNotice(title, content, pinned);

      if (result.error) {
        msg.textContent = result.error;
        msg.className = 'form-msg show err';
        return;
      }

      msg.textContent = '등록되었습니다.';
      msg.className = 'form-msg show ok';
      document.getElementById('nTitle').value = '';
      document.getElementById('nBody').value = '';
      document.getElementById('nPinned').checked = false;
      await refresh();
    });

    document.addEventListener("DOMContentLoaded", () => {
      const userStr = localStorage.getItem('user');
      let user = null;
      try { user = userStr ? JSON.parse(userStr) : null; } catch (e) { }

      const btnWrite = document.getElementById('btnToggleWrite');
      const btnDelete = document.getElementById('btnDeleteNotice');
      if (btnWrite) {
        if (user && user.role === 'admin') {
          btnWrite.style.display = 'inline-block';
          if (btnDelete) btnDelete.style.display = 'inline-block';
        } else {
          btnWrite.style.display = 'none';
          if (btnDelete) btnDelete.style.display = 'none';
        }
      }
    });

    refresh();
  </script>
